# Banc d'essai local : Home Assistant + (optionnel) fausse passerelle MyLight.
#
#   Avec votre vraie passerelle :   docker compose up -d
#   Avec la fausse passerelle :     docker compose --profile mock up -d
#
# Interface HA : http://localhost:8123
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-mylight-dev
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./dev/config:/config
      # Votre code est monté directement : pas de copie à refaire.
      - ./custom_components/mylight_local:/config/custom_components/mylight_local
    restart: unless-stopped

  mock-gateway:
    image: python:3.12-slim
    container_name: mylight-mock
    profiles: ["mock"]
    ports:
      - "8099:8099"
    volumes:
      - ./dev/mock_gateway.py:/app/mock_gateway.py:ro
    command: sh -c "pip install -q aiohttp && python /app/mock_gateway.py"
